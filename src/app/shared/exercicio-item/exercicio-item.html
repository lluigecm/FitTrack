<div class="exercicio-item">
  <div class="exercicio-icon">💪</div>
  <div class="exercicio-info">
    <strong class="exercicio-nome">{{ nome }}</strong>
    <span class="exercicio-cat" [attr.data-cat]="categoriaSlug">{{ categoria }}</span>
  </div>
  <button class="btn-delete" (click)="remover.emit()" title="Remover exercício">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6l-1 14H6L5 6"/>
      <path d="M10 11v6M14 11v6"/>
      <path d="M9 6V4h6v2"/>
    </svg>
  </button>
</div>
