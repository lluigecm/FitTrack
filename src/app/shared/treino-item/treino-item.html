<div class="treino-item">
  <div class="treino-accent"></div>
  <a class="treino-link" [routerLink]="['/treinos', id]">
    <div class="treino-icon">🏋️</div>
    <div class="treino-info">
      <strong class="treino-nome">{{ nome }}</strong>
      <span class="treino-data">{{ data }}</span>
    </div>
  </a>
  <div class="treino-actions">
    <button class="btn-action btn-delete" (click)="remover.emit()" title="Remover treino">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14H6L5 6"/>
        <path d="M10 11v6M14 11v6"/>
        <path d="M9 6V4h6v2"/>
      </svg>
    </button>
  </div>
</div>
