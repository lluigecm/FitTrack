<div class="dashboard">
  <div class="page-header">
    <div>
      <h2 class="page-title">Dashboard</h2>
      <p class="page-subtitle">Visão geral dos seus treinos</p>
    </div>
  </div>

  <div class="stats-grid">
    <app-card titulo="Treinos este mês" [valor]="treinosEsteMes.toString()" icon="🏋️" accent="blue" />
    <app-card titulo="Último treino" [valor]="ultimoTreino" icon="📅" accent="green" />
    <app-card titulo="Exercícios cadastrados" [valor]="exerciciosCadastrados.toString()" icon="📋" accent="mauve" />
  </div>

  <div class="section">
    <h3 class="section-title">Treinos por mês</h3>
    <div class="chart-area">
      <div class="chart-bars">
        @for (barra of barras; track barra.label) {
          <div class="bar-group">
            <span class="bar-count">{{ barra.count }}</span>
            <div
              class="bar"
              [class.active]="barra.ativo"
              [style.height.%]="barra.altura"
            ></div>
            <span [class.active-label]="barra.ativo">{{ barra.label }}</span>
          </div>
        }
      </div>
    </div>
    <p class="chart-note">Últimos 6 meses · dados reais da sua conta</p>
  </div>
</div>
