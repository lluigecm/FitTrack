<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="10" width="3" height="4" rx="1" fill="currentColor"/>
        <rect x="18" y="10" width="3" height="4" rx="1" fill="currentColor"/>
        <rect x="6" y="6" width="3" height="12" rx="1" fill="currentColor"/>
        <rect x="15" y="6" width="3" height="12" rx="1" fill="currentColor"/>
        <rect x="9" y="8" width="6" height="8" rx="1" fill="currentColor"/>
      </svg>
      <h1>FitTrack</h1>
    </div>
    <p class="login-subtitle">Entre na sua conta para continuar</p>

    <form (ngSubmit)="login()">
      <div class="field">
        <label for="email">Usuário</label>
        <input
          id="email"
          type="text"
          placeholder="admin"
          [(ngModel)]="email"
          name="email"
          autocomplete="username"
        />
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input
          id="senha"
          type="password"
          placeholder="••••••••"
          [(ngModel)]="senha"
          name="senha"
          autocomplete="current-password"
        />
      </div>

      @if (erro) {
        <div class="erro-msg">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <circle cx="12" cy="16" r="0.5" fill="currentColor" stroke-width="0"/>
          </svg>
          {{ erro }}
        </div>
      }

      <button type="submit" class="btn-submit">Entrar</button>
    </form>

    <p class="login-hint">Use <code>admin</code>/<code>admin</code> ou <code>teste</code>/<code>0000</code></p>
  </div>
</div>
